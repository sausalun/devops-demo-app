<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>🚀 DevOps CI/CD Demo</h1>

        <p class="subtitle">
            Automated Deployment using Jenkins + Docker + K3s
        </p>

        <div class="info">
            <div class="box">
                <h2>Version</h2>
                <p>v1.0.0</p>
            </div>

            <div class="box">
                <h2>Environment</h2>
                <p>Production</p>
            </div>

            <div class="box">
                <h2>Status</h2>
                <p class="success">Live ✅</p>
            </div>
        </div>

        <button onclick="showMessage()">
            Trigger Deployment
        </button>

        <p id="message"></p>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
