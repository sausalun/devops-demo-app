apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: demo-app

  template:
    metadata:
      labels:
        app: demo-app

    spec:
      containers:
      - name: demo-app
        image: sau4422/demo-app:latest

        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: demo-app-service

spec:
  type: NodePort

  selector:
    app: demo-app

  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
